<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Paiement Stripe</title>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: transparent;
        }
        #payment-form {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }
        #payment-element {
            margin-bottom: 24px;
        }
        button {
            background: #5E548E;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        button:hover {
            background: #231942;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(94,84,142,0.3);
        }
        .error {
            color: #ff6b6b;
            margin-top: 10px;
            text-align: center;
            font-size: 14px;
        }
        .success {
            color: #10b981;
            text-align: center;
            font-size: 16px;
            margin-top: 20px;
        }
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
            color: #5E548E;
        }
    </style>
</head>
<body>
<div id="payment-form">
    <div style="text-align: center; margin-bottom: 20px;">
        <span style="font-size: 48px;">💰</span>
        <h2 style="color: #231942;">Paiement sécurisé</h2>
    </div>

    <div id="payment-element"></div>
    <button id="submit-button">Payer maintenant</button>
    <div id="error-message" class="error"></div>
    <div id="success-message" class="success"></div>
    <div id="loading-message" class="loading">Traitement en cours...</div>
</div>

<script>
    const stripe = Stripe('{{PUBLISHABLE_KEY}}');
    const clientSecret = '{{CLIENT_SECRET}}';

    const appearance = {
        theme: 'stripe',
        variables: {
            colorPrimary: '#5E548E',
            colorBackground: '#ffffff',
            colorText: '#231942',
            colorDanger: '#ff6b6b',
            fontFamily: 'Arial, sans-serif',
            borderRadius: '8px'
        }
    };

    const elements = stripe.elements({ clientSecret, appearance });
    const paymentElement = elements.create('payment');
    paymentElement.mount('#payment-element');

    document.getElementById('submit-button').addEventListener('click', async () => {
        const button = document.getElementById('submit-button');
        const errorDiv = document.getElementById('error-message');
        const successDiv = document.getElementById('success-message');
        const loadingDiv = document.getElementById('loading-message');

        button.disabled = true;
        button.textContent = 'Traitement...';
        loadingDiv.style.display = 'block';

        try {
            const { error } = await stripe.confirmPayment({
                elements,
                confirmParams: {
                    return_url: 'https://carrieri.app/success'
                },
                redirect: 'if_required'
            });

            if (error) {
                errorDiv.innerText = error.message;
                button.disabled = false;
                button.textContent = 'Payer maintenant';
                loadingDiv.style.display = 'none';
            } else {
                successDiv.innerText = '✅ Paiement réussi ! Retour au catalogue...';
                loadingDiv.style.display = 'none';

                // ✅ COMMUNIQUER AVEC JAVAFX
                try {
                    // Méthode 1: via JavaBridge (si disponible)
                    if (window.java) {
                        window.java.paiementReussi();
                    }
                    // Méthode 2: via changement d'URL (plus fiable)
                    else {
                        window.location.href = 'http://localhost/paiement-success';
                    }
                } catch(e) {
                    console.log('Erreur communication: ' + e);
                }
            }
        } catch (err) {
            errorDiv.innerText = 'Erreur de paiement: ' + err.message;
            button.disabled = false;
            button.textContent = 'Payer maintenant';
            loadingDiv.style.display = 'none';
        }
    });
</script>
</body>
</html>
